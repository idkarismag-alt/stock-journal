<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>주식 매매 일지 뷰어</title>
  <style>
    :root{
      --bg:#0b0f15;
      --panel:rgba(15,20,28,.92);
      --panel-soft:rgba(20,26,36,.88);
      --line:rgba(255,255,255,.10);
      --text:#eef2f7;
      --muted:#aab4c3;
      --accent:#67adff;
      --good:#1f8f5f;
      --bad:#b84a4a;
      --mid:#9b7c1d;
      --shadow:0 12px 32px rgba(0,0,0,.32);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{
      margin:0;
      background:linear-gradient(180deg,#0a0d12,#0d131b 55%,#090c11);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      overflow:hidden;
      user-select:none;
    }

    .app{position:fixed; inset:0;}
    .stage{position:relative; width:100%; height:100%; overflow:hidden;}

    .image-wrap{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:72px 18px 112px;
      transition:padding .18s ease;
    }
    .stage.hide-ui .image-wrap{padding:10px}

    .main-image{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:#000;
      box-shadow:var(--shadow);
      cursor:zoom-in;
    }
    .empty{
      color:var(--muted);
      font-size:15px;
      padding:18px 22px;
      border-radius:14px;
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
    }

    .ui{
      position:absolute;
      left:12px;
      right:12px;
      z-index:20;
      transition:opacity .18s ease, transform .18s ease;
    }
    .stage.hide-ui .ui,
    .stage.hide-ui .edge-nav,
    .stage.hide-ui .image-nav{
      opacity:0;
      pointer-events:none;
    }

    .topbar{
      top:calc(var(--safe-top) + 8px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .top-left,.top-right{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      flex-wrap:wrap;
    }

    .chip,.btn,.badge,.tab-btn,.filter-btn{
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .btn{
      height:42px;
      min-width:42px;
      border-radius:14px;
      padding:0 14px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
    }
    .btn.small{
      height:38px;
      min-width:38px;
      border-radius:12px;
      padding:0 12px;
      font-size:13px;
    }

    .chip{
      min-height:42px;
      display:flex;
      align-items:center;
      padding:0 12px;
      border-radius:14px;
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
      max-width:min(44vw, 320px);
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .badge{
      min-height:34px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 10px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
    }
    .cat-good,.result-good{background:rgba(31,143,95,.24); color:#8ce0b8}
    .cat-bad,.result-bad{background:rgba(184,74,74,.24); color:#ffb0b0}
    .cat-mid,.result-mid{background:rgba(155,124,29,.24); color:#ffe39c}

    .bottombar{
      bottom:calc(var(--safe-bottom) + 8px);
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .bottom-row{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
    }
    .bottom-left,.bottom-right{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      flex-wrap:wrap;
    }

    .tabs{display:flex; gap:8px}
    .tab-btn,.filter-btn{
      min-height:40px;
      border-radius:12px;
      padding:0 12px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
    }
    .tab-btn.active,.filter-btn.active{
      outline:2px solid var(--accent);
      border-color:rgba(103,173,255,.45);
    }

    .memo-box{
      padding:11px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      font-size:13px;
      line-height:1.45;
      color:var(--text);
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .hint{
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }

    .edge-nav{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      z-index:22;
      width:44px;
      height:72px;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(9,12,18,.82);
      color:var(--text);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      font-weight:900;
      cursor:pointer;
    }
    .edge-nav.left{left:8px}
    .edge-nav.right{right:8px}

    .image-nav{
      position:absolute;
      left:50%;
      bottom:calc(var(--safe-bottom) + 116px);
      transform:translateX(-50%);
      z-index:22;
      display:flex;
      gap:8px;
      transition:opacity .18s ease;
    }

    .backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.34);
      z-index:34;
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease;
    }
    .backdrop.show{opacity:1; pointer-events:auto}

    .drawer{
      position:absolute;
      top:0;
      bottom:0;
      width:min(84vw, 360px);
      z-index:40;
      background:rgba(10,14,20,.98);
      border-right:1px solid var(--line);
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      transform:translateX(-102%);
      transition:transform .2s ease;
    }
    .drawer.right{
      right:0;
      left:auto;
      border-right:0;
      border-left:1px solid var(--line);
      transform:translateX(102%);
    }
    .drawer.open{transform:translateX(0)}

    .drawer-header{
      padding:calc(var(--safe-top) + 12px) 14px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.18);
    }
    .drawer-title{
      font-size:17px;
      font-weight:900;
      letter-spacing:-.02em;
    }
    .drawer-body{
      padding:12px;
      overflow:auto;
      flex:1;
    }
    .drawer-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .drawer-item{
      width:100%;
      text-align:left;
      padding:14px 14px;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--text);
      font-size:15px;
      cursor:pointer;
      box-shadow:var(--shadow);
    }
    .drawer-item.active{
      outline:2px solid var(--accent);
      border-color:rgba(103,173,255,.45);
    }
    .drawer-main{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      font-weight:900;
    }
    .drawer-sub{
      color:var(--muted);
      font-size:13px;
      margin-top:8px;
      line-height:1.35;
    }
    .filter-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    .lightbox{
      position:absolute;
      inset:0;
      z-index:80;
      background:rgba(0,0,0,.95);
      display:none;
      flex-direction:column;
    }
    .lightbox.show{display:flex}
    .lightbox-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:calc(var(--safe-top) + 8px) 12px 8px;
    }
    .lightbox-center{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
      overflow:auto;
    }
    .lightbox img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      background:#000;
      border-radius:12px;
    }
    .lightbox-bottom{
      padding:8px 12px calc(var(--safe-bottom) + 10px);
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    @media (orientation: portrait){
      .topbar{flex-direction:column; align-items:stretch}
      .top-left,.top-right{width:100%; justify-content:space-between}
      .bottom-row{flex-direction:column; align-items:stretch}
      .bottom-left,.bottom-right{width:100%; justify-content:space-between}
      .edge-nav{height:60px; width:40px; font-size:24px}
      .memo-box{-webkit-line-clamp:3}
      .image-wrap{padding:86px 14px 118px}
      .chip{max-width:100%}
    }

    @media (orientation: landscape){
      .image-wrap{padding:70px 16px 94px}
      .drawer{width:min(42vw, 340px)}
    }

    /* v7.3 웹 마킹 도구 */
    .annotation-canvas{
      position:absolute;
      z-index:12;
      display:none;
      touch-action:none;
      pointer-events:none;
    }
    .stage.annotation-on .annotation-canvas{
      pointer-events:auto;
      cursor:crosshair;
    }
    .annotation-toolbar{
      top:calc(var(--safe-top) + 56px);
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
      pointer-events:auto;
    }
    .stage.hide-ui .annotation-toolbar{
      opacity:0;
      pointer-events:none;
    }
    .anno-group{
      display:flex;
      align-items:center;
      gap:5px;
      padding:5px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--panel);
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }
    .anno-btn{
      height:34px;
      min-width:34px;
      border-radius:11px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--text);
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      padding:0 9px;
    }
    .anno-btn.active{
      outline:2px solid var(--accent);
      border-color:rgba(103,173,255,.45);
      background:rgba(103,173,255,.18);
    }
    .anno-color{
      width:34px;
      height:34px;
      border:0;
      border-radius:10px;
      background:transparent;
      padding:0;
      cursor:pointer;
    }
    .anno-size{
      width:56px;
      height:34px;
      border-radius:10px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--text);
      text-align:center;
      font-weight:900;
    }
    .anno-hint{
      font-size:12px;
      color:var(--muted);
      padding:0 6px;
      white-space:nowrap;
    }
    @media (orientation: portrait){
      .annotation-toolbar{
        top:calc(var(--safe-top) + 92px);
        left:8px;
        right:8px;
      }
      .anno-hint{display:none}
      .anno-btn{font-size:11px; padding:0 7px}
    }

  </style>
</head>
<body>
  <div class="app">
    <div id="stage" class="stage">
      <div class="ui topbar">
        <div class="top-left">
          <button class="btn" id="openDateDrawer">날짜</button>
          <button class="btn" id="openTickerDrawer">종목</button>
          <div class="chip" id="dateChip">날짜 없음</div>
        </div>
        <div class="top-right">
          <div class="chip" id="tickerChip">종목 없음</div>
          <span class="badge" id="categoryBadge">카테고리</span>
          <span class="badge" id="resultBadge">결과</span>
          <span class="badge" id="pnlBadge">수익률</span>
        </div>
      </div>

      <button class="edge-nav left" id="prevTicker">‹</button>
      <button class="edge-nav right" id="nextTicker">›</button>

      <div class="image-wrap" id="imageWrap">
        <img id="mainImage" class="main-image" alt="차트 이미지" style="display:none">
        <canvas id="annotationCanvas" class="annotation-canvas"></canvas>
        <div id="emptyBox" class="empty">등록된 이미지가 없습니다.</div>
      </div>

      <div class="image-nav" id="imageNav">
        <button class="btn small" id="prevImage">〈 이미지</button>
        <button class="btn small" id="nextImage">이미지 〉</button>
      </div>

      <div class="ui annotation-toolbar" id="annotationToolbar">
        <div class="anno-group">
          <button class="anno-btn" id="annoToggle">마킹 OFF</button>
          <button class="anno-btn active" data-anno-mode="pen">펜</button>
          <button class="anno-btn" data-anno-mode="rect">네모</button>
          <button class="anno-btn" data-anno-mode="oval">원</button>
          <button class="anno-btn" data-anno-mode="text">텍스트</button>
          <input class="anno-color" id="annoColor" type="color" value="#ff3b30" title="색상">
          <input class="anno-size" id="annoSize" type="number" min="1" max="30" value="4" title="굵기">
          <button class="anno-btn" id="annoUndo">취소</button>
          <button class="anno-btn" id="annoClear">전체삭제</button>
          <span class="anno-hint">브라우저별 자동저장</span>
        </div>
      </div>

      <div class="ui bottombar">
        <div class="bottom-row">
          <div class="bottom-left">
            <div class="tabs">
              <button class="tab-btn active" data-slot="일봉">일봉</button>
              <button class="tab-btn" data-slot="분봉">분봉</button>
            </div>
            <div class="chip" id="imageCounter">0 / 0</div>
          </div>
          <div class="bottom-right">
            <div class="chip" id="summaryChip">간단메모 없음</div>
          </div>
        </div>
        <div class="memo-box" id="memoBox">종목 메모 없음</div>
        <div class="hint">이미지 탭: 전체보기 / 스와이프: 종목 이동</div>
      </div>

      <div id="backdrop" class="backdrop"></div>

      <aside id="dateDrawer" class="drawer">
        <div class="drawer-header">
          <div class="drawer-title">날짜 선택</div>
          <button class="btn small" data-close="dateDrawer">닫기</button>
        </div>
        <div class="drawer-body">
          <div id="dateList" class="drawer-list"></div>
        </div>
      </aside>

      <aside id="tickerDrawer" class="drawer right">
        <div class="drawer-header">
          <div class="drawer-title">종목 선택</div>
          <button class="btn small" data-close="tickerDrawer">닫기</button>
        </div>
        <div class="drawer-body">
          <div id="categoryFilters" class="filter-row"></div>
          <div id="tickerList" class="drawer-list"></div>
        </div>
      </aside>

      <div id="lightbox" class="lightbox">
        <div class="lightbox-top">
          <div class="chip" id="lightboxTitle">이미지 보기</div>
          <button class="btn" id="closeLightbox">닫기</button>
        </div>
        <div class="lightbox-center">
          <img id="lightboxImage" alt="확대 이미지">
        </div>
        <div class="lightbox-bottom">핀치 확대 가능 · 닫기로 복귀</div>
      </div>
    </div>
  </div>

  <script>
    const CACHE_BUSTER = Date.now();
    let journal = {};
    let currentDate = null;
    let currentTicker = null;
    let currentSlot = "일봉";
    let currentCategoryFilter = "전체";
    let currentImageIndex = 0;
    let touchStartX = null;
    let touchStartY = null;

    // v7.3 웹 마킹 정보는 원본 이미지가 아니라 브라우저 localStorage에 별도 저장
    const ANNO_STORAGE_KEY = "tradeJournalWebAnnotations.v1";
    let annotationEnabled = false;
    let annotationMode = "pen";
    let annotationStore = loadAnnotationStore();
    let currentStroke = null;
    let shapeStart = null;
    let previewShape = null;
    let isDrawingAnnotation = false;

    const stage = document.getElementById("stage");
    const mainImage = document.getElementById("mainImage");
    const imageWrap = document.getElementById("imageWrap");
    const annotationCanvas = document.getElementById("annotationCanvas");
    const annoCtx = annotationCanvas.getContext("2d");
    const annoToggle = document.getElementById("annoToggle");
    const annoColor = document.getElementById("annoColor");
    const annoSize = document.getElementById("annoSize");
    const emptyBox = document.getElementById("emptyBox");
    const dateChip = document.getElementById("dateChip");
    const tickerChip = document.getElementById("tickerChip");
    const categoryBadge = document.getElementById("categoryBadge");
    const resultBadge = document.getElementById("resultBadge");
    const pnlBadge = document.getElementById("pnlBadge");
    const imageCounter = document.getElementById("imageCounter");
    const summaryChip = document.getElementById("summaryChip");
    const memoBox = document.getElementById("memoBox");
    const dateList = document.getElementById("dateList");
    const categoryFilters = document.getElementById("categoryFilters");
    const tickerList = document.getElementById("tickerList");
    const dateDrawer = document.getElementById("dateDrawer");
    const tickerDrawer = document.getElementById("tickerDrawer");
    const backdrop = document.getElementById("backdrop");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxTitle = document.getElementById("lightboxTitle");

    function categoryClass(cat){
      if(cat === "좋은종목") return "cat-good";
      if(cat === "하면안됨") return "cat-bad";
      return "cat-mid";
    }
    function resultClass(result){
      if(result === "성공") return "result-good";
      if(result === "실패") return "result-bad";
      return "result-mid";
    }
    function textOrEmpty(text, fallback="없음"){
      return (text && String(text).trim()) ? String(text).trim() : fallback;
    }
    function escapeHtml(value){
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;"
      }[ch]));
    }
    function normalizeTickerEntry(entry){
      const item = (entry && typeof entry === "object") ? {...entry} : {};
      item.memo = item.memo || "";
      item.category = item.category || "미분류";
      item.result = item.result || "미정";
      item.pnl = item.pnl || "";
      item.summary = item.summary || "";
      item.slot_images = item.slot_images && typeof item.slot_images === "object" ? item.slot_images : {};
      item.slot_images["일봉"] = Array.isArray(item.slot_images["일봉"]) ? item.slot_images["일봉"] : [];
      item.slot_images["분봉"] = Array.isArray(item.slot_images["분봉"]) ? item.slot_images["분봉"] : [];
      if(Array.isArray(item.images) && item.images.length && !item.slot_images["일봉"].length){
        item.slot_images["일봉"] = item.images.slice();
      }
      return item;
    }
    function tickerHasRealData(item){
      if(!item) return false;
      if((item.memo || "").trim()) return true;
      if((item.summary || "").trim()) return true;
      if(String(item.pnl || "").trim()) return true;
      if(item.slot_images?.["일봉"]?.length) return true;
      if(item.slot_images?.["분봉"]?.length) return true;
      return false;
    }
    function normalizeJournalData(data){
      const out = {entries:{}};
      const entries = data?.entries && typeof data.entries === "object" ? data.entries : {};
      Object.entries(entries).forEach(([dateKey, raw]) => {
        const dateEntry = raw && typeof raw === "object" ? raw : {};
        const tickers = {};
        if(dateEntry.tickers && typeof dateEntry.tickers === "object"){
          Object.entries(dateEntry.tickers).forEach(([name, item]) => tickers[name] = normalizeTickerEntry(item));
        }
        // 구버전/혼합 구조: 날짜 바로 아래의 종목들도 누락 없이 tickers로 합친다.
        Object.entries(dateEntry).forEach(([key, item]) => {
          if(key === "daily_summary" || key === "tickers") return;
          if(item && typeof item === "object" && !Array.isArray(item)){
            tickers[key] = normalizeTickerEntry({...item, ...(tickers[key] || {})});
          }
        });
        // v7.2: 실제 종목 데이터가 0개인 날짜는 웹 목록에서 제외
        const realTickers = {};
        Object.entries(tickers).forEach(([name, item]) => {
          if(tickerHasRealData(item)) realTickers[name] = item;
        });
        if(Object.keys(realTickers).length){
          out.entries[dateKey] = {
            daily_summary: typeof dateEntry.daily_summary === "string" ? dateEntry.daily_summary : "",
            tickers: realTickers
          };
        }
      });
      return out;
    }
    function getDateEntry(){ return journal.entries?.[currentDate] || null; }
    function getTickers(){ return getDateEntry()?.tickers || {}; }
    function getTickerEntry(){ return getTickers()?.[currentTicker] || null; }
    function getImages(){ return getTickerEntry()?.slot_images?.[currentSlot] || []; }

    function getFilteredTickerNames(){
      const tickers = getTickers();
      return Object.keys(tickers).filter(name => {
        const cat = tickers[name]?.category || "미분류";
        return currentCategoryFilter === "전체" || cat === currentCategoryFilter;
      }).sort();
    }

    function getAvailableCategories(){
      const tickers = getTickers();
      const cats = new Set(["전체"]);
      Object.values(tickers).forEach(item => cats.add(item.category || "미분류"));
      return Array.from(cats);
    }

    function clampImageIndex(){
      const imgs = getImages();
      if(!imgs.length){ currentImageIndex = 0; return; }
      if(currentImageIndex < 0) currentImageIndex = 0;
      if(currentImageIndex > imgs.length - 1) currentImageIndex = imgs.length - 1;
    }

    function renderDateList(){
      dateList.innerHTML = "";
      const dates = Object.keys(journal.entries || {}).filter(d => Object.keys(journal.entries[d]?.tickers || {}).length > 0).sort().reverse();
      dates.forEach(d => {
        const entry = journal.entries[d] || {};
        const count = Object.keys(entry.tickers || {}).length;
        const btn = document.createElement("button");
        btn.className = "drawer-item" + (d === currentDate ? " active" : "");
        btn.innerHTML = `
          <div class="drawer-main"><span>${escapeHtml(d)}</span><span class="badge">${count}개</span></div>
          <div class="drawer-sub">${entry.daily_summary && entry.daily_summary.trim() ? "당일요약 있음" : "당일요약 없음"}</div>
        `;
        btn.onclick = () => {
          currentDate = d;
          currentCategoryFilter = "전체";
          const names = Object.keys(getTickers()).sort();
          currentTicker = names.length ? names[0] : null;
          currentImageIndex = 0;
          closeDrawers();
          renderAll();
        };
        dateList.appendChild(btn);
      });
    }

    function renderCategoryFilters(){
      categoryFilters.innerHTML = "";
      getAvailableCategories().forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "filter-btn" + (cat === currentCategoryFilter ? " active" : "");
        btn.textContent = cat;
        btn.onclick = () => {
          currentCategoryFilter = cat;
          const names = getFilteredTickerNames();
          if(!names.includes(currentTicker)){
            currentTicker = names.length ? names[0] : null;
            currentImageIndex = 0;
          }
          renderTickerList();
          renderInfo();
          renderImage();
          updateNav();
        };
        categoryFilters.appendChild(btn);
      });
    }

    function renderTickerList(){
      tickerList.innerHTML = "";
      const tickers = getTickers();
      const names = getFilteredTickerNames();

      if(!names.length){
        tickerList.innerHTML = '<div class="drawer-sub">해당 카테고리에 종목이 없습니다.</div>';
        return;
      }

      names.forEach(name => {
        const item = tickers[name];
        const btn = document.createElement("button");
        btn.className = "drawer-item" + (name === currentTicker ? " active" : "");
        btn.innerHTML = `
          <div class="drawer-main">
            <strong>${escapeHtml(name)}</strong>
            <span class="badge ${resultClass(item.result || "미정")}">${escapeHtml(item.result || "미정")}</span>
          </div>
          <div class="drawer-sub">${escapeHtml(item.category || "미분류")} / ${escapeHtml(item.pnl || "-")} / ${escapeHtml(item.summary || "-")}</div>
        `;
        btn.onclick = () => {
          currentTicker = name;
          currentImageIndex = 0;
          closeDrawers();
          renderAll();
        };
        tickerList.appendChild(btn);
      });
    }

    function renderInfo(){
      const dateEntry = getDateEntry();
      const tickerEntry = getTickerEntry();

      dateChip.textContent = currentDate || "날짜 없음";
      tickerChip.textContent = currentTicker || "종목 없음";

      if(dateEntry && dateEntry.daily_summary && dateEntry.daily_summary.trim()){
        dateChip.textContent = `${currentDate} · 요약 있음`;
      }

      if(!tickerEntry){
        categoryBadge.textContent = "카테고리";
        categoryBadge.className = "badge";
        resultBadge.textContent = "결과";
        resultBadge.className = "badge";
        pnlBadge.textContent = "수익률";
        pnlBadge.className = "badge";
        summaryChip.textContent = "간단메모 없음";
        memoBox.textContent = "종목 메모 없음";
        return;
      }

      categoryBadge.textContent = tickerEntry.category || "미분류";
      categoryBadge.className = "badge " + categoryClass(tickerEntry.category || "미분류");

      resultBadge.textContent = tickerEntry.result || "미정";
      resultBadge.className = "badge " + resultClass(tickerEntry.result || "미정");

      pnlBadge.textContent = tickerEntry.pnl || "수익률 -";
      pnlBadge.className = "badge";

      summaryChip.textContent = textOrEmpty(tickerEntry.summary, "간단메모 없음");
      memoBox.textContent = textOrEmpty(tickerEntry.memo, "종목 메모 없음");
    }


    function loadAnnotationStore(){
      try{
        const raw = localStorage.getItem(ANNO_STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      }catch(e){
        return {};
      }
    }

    function saveAnnotationStore(){
      try{
        localStorage.setItem(ANNO_STORAGE_KEY, JSON.stringify(annotationStore));
      }catch(e){
        alert("마킹 저장 실패: 브라우저 저장공간을 확인하세요.");
      }
    }

    function getCurrentImageRaw(){
      const imgs = getImages();
      if(!imgs.length) return "";
      return imgs[currentImageIndex] || "";
    }

    function getAnnotationKey(){
      const raw = getCurrentImageRaw();
      if(!raw) return "";
      // 이미지 파일 경로를 기준으로 저장. journal.json이 다시 올라와도 같은 이미지면 유지된다.
      return raw.split("?")[0];
    }

    function getCurrentAnnotations(){
      const key = getAnnotationKey();
      if(!key) return [];
      if(!Array.isArray(annotationStore[key])) annotationStore[key] = [];
      return annotationStore[key];
    }

    function setCurrentAnnotations(items){
      const key = getAnnotationKey();
      if(!key) return;
      annotationStore[key] = Array.isArray(items) ? items : [];
      saveAnnotationStore();
    }

    function syncAnnotationCanvas(){
      if(!mainImage || mainImage.style.display === "none"){
        annotationCanvas.style.display = "none";
        return;
      }
      const imgRect = mainImage.getBoundingClientRect();
      const wrapRect = imageWrap.getBoundingClientRect();
      const w = Math.max(1, Math.round(imgRect.width));
      const h = Math.max(1, Math.round(imgRect.height));

      annotationCanvas.style.left = `${imgRect.left - wrapRect.left}px`;
      annotationCanvas.style.top = `${imgRect.top - wrapRect.top}px`;
      annotationCanvas.style.width = `${w}px`;
      annotationCanvas.style.height = `${h}px`;
      annotationCanvas.width = w;
      annotationCanvas.height = h;
      annotationCanvas.style.display = "block";
      renderAnnotations();
    }

    function normPointFromEvent(e){
      const rect = annotationCanvas.getBoundingClientRect();
      const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX) ?? 0;
      const clientY = e.clientY ?? (e.touches && e.touches[0]?.clientY) ?? 0;
      const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
      return {x, y};
    }

    function px(p){
      return {
        x: p.x * annotationCanvas.width,
        y: p.y * annotationCanvas.height
      };
    }

    function drawAnnotationItem(ctx, item){
      ctx.save();
      ctx.strokeStyle = item.color || "#ff3b30";
      ctx.fillStyle = item.color || "#ff3b30";
      ctx.lineWidth = Number(item.size || 4);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if(item.type === "pen" && Array.isArray(item.points) && item.points.length){
        ctx.beginPath();
        item.points.forEach((p, idx) => {
          const q = px(p);
          if(idx === 0) ctx.moveTo(q.x, q.y);
          else ctx.lineTo(q.x, q.y);
        });
        ctx.stroke();
      }

      if((item.type === "rect" || item.type === "oval") && item.start && item.end){
        const a = px(item.start);
        const b = px(item.end);
        const x = Math.min(a.x, b.x);
        const y = Math.min(a.y, b.y);
        const w = Math.abs(b.x - a.x);
        const h = Math.abs(b.y - a.y);

        if(item.type === "rect"){
          ctx.strokeRect(x, y, w, h);
        }else{
          ctx.beginPath();
          ctx.ellipse(x + w/2, y + h/2, Math.max(1, w/2), Math.max(1, h/2), 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      if(item.type === "text" && item.pos && item.text){
        const p = px(item.pos);
        const size = Math.max(10, Number(item.size || 18) * 4);
        ctx.font = `900 ${size}px -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif`;
        ctx.textBaseline = "top";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(0,0,0,.55)";
        ctx.strokeText(item.text, p.x, p.y);
        ctx.fillStyle = item.color || "#ff3b30";
        ctx.fillText(item.text, p.x, p.y);
      }

      ctx.restore();
    }

    function renderAnnotations(){
      if(!annotationCanvas.width || !annotationCanvas.height) return;
      annoCtx.clearRect(0, 0, annotationCanvas.width, annotationCanvas.height);
      getCurrentAnnotations().forEach(item => drawAnnotationItem(annoCtx, item));
      if(currentStroke) drawAnnotationItem(annoCtx, currentStroke);
      if(previewShape) drawAnnotationItem(annoCtx, previewShape);
    }

    function setAnnotationEnabled(value){
      annotationEnabled = !!value;
      stage.classList.toggle("annotation-on", annotationEnabled);
      annoToggle.textContent = annotationEnabled ? "마킹 ON" : "마킹 OFF";
      annoToggle.classList.toggle("active", annotationEnabled);
    }

    function setAnnotationMode(mode){
      annotationMode = mode;
      document.querySelectorAll("[data-anno-mode]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.annoMode === mode);
      });
    }

    function annotationPointerDown(e){
      if(!annotationEnabled || !getAnnotationKey()) return;
      e.preventDefault();
      e.stopPropagation();

      const p = normPointFromEvent(e);
      const color = annoColor.value || "#ff3b30";
      const size = Math.max(1, Math.min(30, Number(annoSize.value || 4)));

      if(annotationMode === "text"){
        const text = prompt("입력할 텍스트");
        if(text && text.trim()){
          const items = getCurrentAnnotations();
          items.push({type:"text", pos:p, text:text.trim(), color, size});
          setCurrentAnnotations(items);
          renderAnnotations();
        }
        return;
      }

      isDrawingAnnotation = true;

      if(annotationMode === "pen"){
        currentStroke = {type:"pen", points:[p], color, size};
      }else{
        shapeStart = p;
        previewShape = {type:annotationMode, start:p, end:p, color, size};
      }
      renderAnnotations();
    }

    function annotationPointerMove(e){
      if(!annotationEnabled || !isDrawingAnnotation) return;
      e.preventDefault();
      e.stopPropagation();

      const p = normPointFromEvent(e);
      if(currentStroke){
        currentStroke.points.push(p);
      }
      if(previewShape && shapeStart){
        previewShape.end = p;
      }
      renderAnnotations();
    }

    function annotationPointerUp(e){
      if(!annotationEnabled || !isDrawingAnnotation) return;
      e.preventDefault();
      e.stopPropagation();

      const items = getCurrentAnnotations();

      if(currentStroke && currentStroke.points.length > 1){
        items.push(currentStroke);
      }
      if(previewShape && shapeStart){
        const dx = Math.abs(previewShape.end.x - previewShape.start.x);
        const dy = Math.abs(previewShape.end.y - previewShape.start.y);
        if(dx > 0.005 && dy > 0.005) items.push(previewShape);
      }

      currentStroke = null;
      shapeStart = null;
      previewShape = null;
      isDrawingAnnotation = false;
      setCurrentAnnotations(items);
      renderAnnotations();
    }

    function undoAnnotation(){
      const items = getCurrentAnnotations();
      items.pop();
      setCurrentAnnotations(items);
      renderAnnotations();
    }

    function clearAnnotations(){
      if(!getAnnotationKey()) return;
      if(!confirm("현재 이미지의 마킹을 모두 삭제할까요?")) return;
      setCurrentAnnotations([]);
      renderAnnotations();
    }


    function renderImage(){
      const imgs = getImages();
      clampImageIndex();

      if(!imgs.length){
        mainImage.style.display = "none";
        annotationCanvas.style.display = "none";
        emptyBox.style.display = "block";
        imageCounter.textContent = "0 / 0";
        return;
      }

      const src = imgs[currentImageIndex] + (imgs[currentImageIndex].includes("?") ? "&" : "?") + "v=" + CACHE_BUSTER;
      mainImage.onload = syncAnnotationCanvas;
      mainImage.src = src;
      mainImage.style.display = "block";
      emptyBox.style.display = "none";
      imageCounter.textContent = `${currentImageIndex + 1} / ${imgs.length}`;
      setTimeout(syncAnnotationCanvas, 80);
    }

    function renderAll(){
      renderDateList();
      renderCategoryFilters();
      renderTickerList();
      renderInfo();
      renderImage();
      updateNav();
    }

    function updateNav(){
      const names = getFilteredTickerNames();
      const idx = names.indexOf(currentTicker);
      document.getElementById("prevTicker").disabled = idx <= 0;
      document.getElementById("nextTicker").disabled = idx < 0 || idx >= names.length - 1;

      const imgs = getImages();
      document.getElementById("prevImage").disabled = currentImageIndex <= 0;
      document.getElementById("nextImage").disabled = currentImageIndex >= imgs.length - 1;
    }

    function moveTicker(delta){
      const names = getFilteredTickerNames();
      const idx = names.indexOf(currentTicker);
      if(idx < 0) return;
      const nextIdx = idx + delta;
      if(nextIdx < 0 || nextIdx >= names.length) return;
      currentTicker = names[nextIdx];
      currentImageIndex = 0;
      renderAll();
    }

    function moveImage(delta){
      const imgs = getImages();
      if(!imgs.length) return;
      const nextIdx = currentImageIndex + delta;
      if(nextIdx < 0 || nextIdx >= imgs.length) return;
      currentImageIndex = nextIdx;
      renderImage();
      updateNav();
    }

    function openDrawer(which){
      closeDrawers();
      if(which === "date") dateDrawer.classList.add("open");
      if(which === "ticker") tickerDrawer.classList.add("open");
      backdrop.classList.add("show");
    }

    function closeDrawers(){
      dateDrawer.classList.remove("open");
      tickerDrawer.classList.remove("open");
      backdrop.classList.remove("show");
    }

    function openLightbox(){
      const imgs = getImages();
      if(!imgs.length) return;
      closeDrawers();
      const src = imgs[currentImageIndex] + (imgs[currentImageIndex].includes("?") ? "&" : "?") + "v=" + CACHE_BUSTER;
      lightboxImage.src = src;
      lightboxTitle.textContent = `${currentDate || ""} · ${currentTicker || ""} · ${currentSlot}`;
      lightbox.classList.add("show");
    }

    function closeLightbox(){
      lightbox.classList.remove("show");
    }

    document.getElementById("openDateDrawer").onclick = () => openDrawer("date");
    document.getElementById("openTickerDrawer").onclick = () => openDrawer("ticker");
    document.querySelectorAll("[data-close]").forEach(btn => btn.onclick = closeDrawers);
    backdrop.onclick = closeDrawers;

    document.getElementById("prevTicker").onclick = () => moveTicker(-1);
    document.getElementById("nextTicker").onclick = () => moveTicker(1);
    document.getElementById("prevImage").onclick = () => moveImage(-1);
    document.getElementById("nextImage").onclick = () => moveImage(1);

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        currentSlot = btn.dataset.slot;
        currentImageIndex = 0;
        document.querySelectorAll(".tab-btn").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        renderImage();
        updateNav();
      };
    });

    mainImage.onclick = () => {
      if(annotationEnabled) return;
      openLightbox();
    };

    annoToggle.onclick = () => setAnnotationEnabled(!annotationEnabled);
    document.querySelectorAll("[data-anno-mode]").forEach(btn => {
      btn.onclick = () => {
        setAnnotationEnabled(true);
        setAnnotationMode(btn.dataset.annoMode);
      };
    });
    document.getElementById("annoUndo").onclick = undoAnnotation;
    document.getElementById("annoClear").onclick = clearAnnotations;
    annoColor.onchange = renderAnnotations;
    annoSize.onchange = renderAnnotations;

    annotationCanvas.addEventListener("pointerdown", annotationPointerDown);
    annotationCanvas.addEventListener("pointermove", annotationPointerMove);
    annotationCanvas.addEventListener("pointerup", annotationPointerUp);
    annotationCanvas.addEventListener("pointercancel", annotationPointerUp);
    window.addEventListener("resize", () => setTimeout(syncAnnotationCanvas, 80));

    document.getElementById("closeLightbox").onclick = closeLightbox;
    lightbox.onclick = (e) => {
      if(e.target === lightbox) closeLightbox();
    };

    stage.addEventListener("touchstart", (e) => {
      if(annotationEnabled && e.target === annotationCanvas) return;
      if(e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, {passive:true});

    stage.addEventListener("touchend", (e) => {
      if(annotationEnabled && e.target === annotationCanvas) return;
      if(lightbox.classList.contains("show")) return;
      if(touchStartX == null || touchStartY == null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
        if(dx < 0) moveTicker(1);
        else moveTicker(-1);
      }
      touchStartX = null;
      touchStartY = null;
    }, {passive:true});

    fetch("./data/journal.json?v=" + CACHE_BUSTER, {cache:"no-store"})
      .then(r => {
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        journal = normalizeJournalData(data || {entries:{}});
        const dates = Object.keys(journal.entries || {}).filter(d => Object.keys(journal.entries[d]?.tickers || {}).length > 0).sort().reverse();
        currentDate = dates.length ? dates[0] : null;
        if(currentDate){
          const names = Object.keys(getTickers()).sort();
          currentTicker = names.length ? names[0] : null;
        }
        renderAll();
      })
      .catch(err => {
        dateChip.textContent = "로드 실패";
        tickerChip.textContent = "data/journal.json";
        summaryChip.textContent = "파일 확인";
        memoBox.textContent = "data/journal.json 로드 실패";
        console.error(err);
      });
  </script>
</body>
</html>
